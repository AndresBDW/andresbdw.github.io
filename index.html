  <div id="wrap"><div id="box"><pre id="output"></pre></div></div>

  <script>
    const SEP = "_".repeat(80);

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderList(items) {
      // items: [nombre, url, descripcion][]
      const maxLen = Math.max(...items.map(([name]) => name.length));
      return items.map(([name, url, desc]) => {
        const link = `<a href="${url}">${escapeHtml(name)}</a>`;
        const pad = " ".repeat(maxLen - name.length + 2);
        return `  ${link}${pad}- ${escapeHtml(desc)}`;
      }).join("\n");
    }

    function renderContact(items) {
      const maxLen = Math.max(...items.map(([label]) => label.length));
      return items.map(([label, text, url]) => {
        const pad = " ".repeat(maxLen - label.length + 2);
        const value = url ? `<a href="${url}">${escapeHtml(text)}</a>` : escapeHtml(text);
        return `  ${label}:${pad}${value}`;
      }).join("\n");
    }

    const intro    = document.getElementById("intro-text").textContent.trim();
    const repos    = JSON.parse(document.getElementById("repos-data").textContent);
    const contact  = JSON.parse(document.getElementById("contact-data").textContent);

    document.getElementById("output").innerHTML =
      intro + "\n\n" +
      SEP + "\n\n" +
      renderList(repos) + "\n\n" +
      SEP + "\n\n" +
      renderContact(contact) + "\n\n" +
      SEP + "\n\n" +
      `<div id="HCB_comment_box"><a href="http://www.htmlcommentbox.com">Loading comments...</a> </div>`;
  </script>
